<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Iso Territory .io</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="healthBar">
      <div id="healthFill"></div>
    </div>
    <div id="teamInfo"></div>
    <div id="scoreInfo"></div>
  </div>

  <div id="inventoryBar">
    <div class="slot" id="slot0"><span class="slotLabel">Silah</span><span class="slotKey">Tık</span></div>
    <div class="slot empty" id="slot1"><span class="slotLabel">-</span><span class="slotKey">2</span></div>
    <div class="slot empty" id="slot2"><span class="slotLabel">-</span><span class="slotKey">3</span></div>
    <div class="slot empty" id="slot3"><span class="slotLabel">-</span><span class="slotKey">4</span></div>
  </div>

  <div id="gameOverScreen" class="hidden">
    <h1 id="winnerText"></h1>
    <button id="restartBtn">Yeniden Basla</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="game.js"></script>
</body>
</html>
